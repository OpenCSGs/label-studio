stages:
  - build
  - test

include:
  # Scan for leaked secrets on MRs and the default branch (GitLab Secret Detection template).
  - component: git-devops.opencsg.com/gitlab/ci-components/secret-detection@v1.4.13

  # Build multi-platform images with Docker buildx and push to registry.opencsg.com.
  - component: git-devops.opencsg.com/gitlab/ci-components/build@v1.4.13
    inputs:
      environment: prod
      edition: all
      tags: ["docker"]
      images:
        - "registry.opencsg.com/opencsghq/label-studio:${CI_COMMIT_TAG}"
        - "docker.io/opencsghq/label-studio:${CI_COMMIT_TAG}"
      platforms: "linux/amd64,linux/arm64"
      proxy: http://172.21.1.212:7897
      no_proxy: "localhost,127.0.0.1,docker,${CI_REGISTRY},${CI_SERVER_HOST},registry.opencsg.com"
      build_args:
        - "BUILD_CN=true"
