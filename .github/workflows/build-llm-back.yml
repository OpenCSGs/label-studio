name: Docker Image CI (llm-back)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          registry: ${{ secrets.ACR_REGISTRY }}

      - name: Build and push per-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          platforms: ${{ matrix.platform }}
          tags: |
            opencsghq/label-studio:${{ github.ref_name }}-llm-back-${{ matrix.suffix }}
            ${{ secrets.ACR_REGISTRY }}/opencsghq/label-studio:${{ github.ref_name }}-llm-back-${{ matrix.suffix }}
          cache-from: type=gha,scope=label-studio-llm-back-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=label-studio-llm-back-${{ matrix.suffix }}

  manifest:
    name: merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          registry: ${{ secrets.ACR_REGISTRY }}

      - name: Create and push multi-arch manifest to Docker Hub
        run: |
          docker buildx imagetools create \
            -t opencsghq/label-studio:${{ github.ref_name }}-llm-back \
            opencsghq/label-studio:${{ github.ref_name }}-llm-back-amd64 \
            opencsghq/label-studio:${{ github.ref_name }}-llm-back-arm64

      - name: Create and push multi-arch manifest to ACR
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.ACR_REGISTRY }}/opencsghq/label-studio:${{ github.ref_name }}-llm-back \
            ${{ secrets.ACR_REGISTRY }}/opencsghq/label-studio:${{ github.ref_name }}-llm-back-amd64 \
            ${{ secrets.ACR_REGISTRY }}/opencsghq/label-studio:${{ github.ref_name }}-llm-back-arm64